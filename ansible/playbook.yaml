---
- name: Setup k8s cluster
  hosts: all
  become: yes
  tasks:
    - name: Disable swap # Отключаем swap, так как kubeadm не работает с включенным swap
      command: swapoff -a
      changed_when: false

    - name: Remove swap from fstab # Коментируем swap в fstab, чтобы он не включался при перезагрузке
      replace: # Модуль замены
        path: /etc/fstab
        regexp: '^(\s*)([^#\n]*\sswap\s+sw\s+.*)$'
        replace: '# \1\2'
        backup: yes

    - name: Load kernel modules
      modprobe: # Модуль для загрузки ядра
        name: "{{ item }}"
        state: present
        loop:
          - overlay
          - br_netfilter

    - name: Configure sysctl
      sysctl:
        name: {item.name}
        value: {item.value}
        state: present
        loop:
          - { name: net.bridge.bridge-nf-call-iptables, value: 1 } # iptables может видеть трафик проходящий через мосты
          - { name: net.bridge.bridge-nf-call-iptables, value: 1 } # тоже самое для ipv6
          - { name: net.ipv4.ip-forward, value: 1} # разрешает маршрутизацию пакетов между сетями

    - name: Install containerd
      apt:
        name: containerd
        state: present
        update_cache: yes # обновить список пакетов

    - name: Create containerd config directory
      file:
        path: /etc/containerd # Пака для конфигов не всегда создается
        state: directory

    - name: Generate default containred config
      shell: containerd config default > /etc/containerd/config.tolm
      args: # Создать если еще не создан
        creates: /etc/containerd/config.tolm

    - name: Restart containerd
      systemd:
        name: containerd
        state: restarted
        enabled: yes

    - name: Add k8s apt key
      apt_key:
        url: https://pkgs.k8s.io/core:/stable:/v1.32/deb/Release.key
        state: present

    - name: Add K8s repo
      apt_repository:
        repo: "deb https://pkgs.k8s.io/core:/stable:/v1.32/deb/ /"
        state: present
        update_cache: yes

    - name: Install kubeadm, kubelet, kubectl
      apt:
        name:
          - kubeadm
          - kubelet
          - kubectl
        state: present

    - name: Hold kubeadm, kubelet, kubectl # Отмена обновлений по команде
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
        loop:
          - kubeadm
          - kubelet
          - kubectl

    
        